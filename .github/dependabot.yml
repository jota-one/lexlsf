version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /pb
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        update-types:
          - minor
          - patch
